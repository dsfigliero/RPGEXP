services:
  - type: web
    name: rpgxptracker
    env: docker
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/rpg.db
    disk:
      name: rpg-data
      mountPath: /var/data
      sizeGB: 1
